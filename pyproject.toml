[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymq"
dynamic = ["version"]
description = "Redis-backed work queue for Python with Lua-atomic state transitions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "redis>=5.0",
    "pydantic>=2.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "pymq/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.uv-cache"]

[project.optional-dependencies]
prometheus = ["prometheus-client>=0.20"]
otel = ["opentelemetry-api>=1.25"]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "pyright>=1.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["pymq"]
